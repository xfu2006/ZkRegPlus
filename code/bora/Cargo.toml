[workspace]
members = [ 
	# processes clamav sigs
	"crates/data_processor",
	# common utils
	"crates/utils", 
	# main zkregplus framework
	"crates/zkregplus",
]
# chr17_variants/reef is a vendored third-party crate (Reef, MIT, upstream
# github.com/eniac/Reef) that the dna dataset unpacks INSIDE this repo. Cargo
# walks up from it, finds this workspace, and aborts with "current package
# believes it's in a workspace when it's not" unless it is excluded here.
exclude = ["./foldpot", "./new_r1cs", "vendor/dependency/nonnative",
           "data/src_sig/chr17_variants/reef"]
resolver = "2"

# we ADDED support for pairing


[patch.crates-io]
# The following patch is to use a version of ark-r1cs-std compatible with
# v0.4.0 but that includes two cherry-picked commits from after v0.4.0 which
# fixes the in-circuit scalar multiplication of the zero point and the
# y-coordinate of the zero point. The commits are respectively from
# https://github.com/arkworks-rs/r1cs-std/pull/124 and
# https://github.com/arkworks-rs/r1cs-std/pull/126, without including other
# changes done between v0.4.0 and this fix which would break compatibility.
#ark-r1cs-std = { git = "https://github.com/winderica/r1cs-std", branch="cherry-pick" }
# patch ark_curves to use a cherry-picked version which contains
# bn254::constraints & grumpkin for v0.4.0 (once arkworks v0.5.0 is released
# this will no longer be needed)
#ark-bn254 = { git = "https://github.com/arnaucube/ark-curves-cherry-picked", branch="cherry-pick"}
#ark-grumpkin = { git = "https://github.com/arnaucube/ark-curves-cherry-picked", branch="cherry-pick"}
# ---- NEW ONES ----
ark-r1cs-std = { version = "0.4.0", path = "./vendor/dependency/r1cs-std" } # this is patched at the workspace level
# patch ark_curves to use a cherry-picked version which contains
# bn254::constraints & grumpkin for v0.4.0 (once arkworks v0.5.0 is released
# this will no longer be needed)
#ark-bn254 = { git = "https://github.com/arnaucube/ark-curves-cherry-picked", branch="cherry-pick"}
# we also ADDED support for pairing in r1cs
ark-bn254 = {version="0.4.0", path = "./vendor/dependency/ark-curves-cherry-picked/bn254"}
#ark-grumpkin = { git = "https://github.com/arnaucube/ark-curves-cherry-picked", branch="cherry-pick"}
ark-grumpkin = { version="0.4.0", path="./vendor/dependency/ark-curves-cherry-picked/grumpkin"}
ark-relations = {version="0.4.0", path="./vendor/dependency/ark-relations"}
