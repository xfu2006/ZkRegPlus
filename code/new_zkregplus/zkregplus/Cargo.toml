[package]
name = "zkregplus"
version = "0.1.0"
edition = "2021"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
hex = "0.4"
rustomaton = {version="0.2.1", path = "../data_processor/dependency/rustomaton"}
utils = {path="../utils"}
data_processor = {path="../data_processor"}
itertools="0.14.0"
stacker="0.1.21"
ark-ec = "^0.4.0"
ark-ff = "^0.4.0"
ark-poly = "^0.4.0"
ark-std = "^0.4.0"
ark-crypto-primitives = { version = "^0.4.0", default-features = false, features = ["r1cs", "sponge", "crh"] }
ark-grumpkin = {version="0.4.0", features=["r1cs"]}
ark-poly-commit = "^0.4.0"
ark-relations = { version = "^0.4.0", default-features = false }
#ark-relations = {path="../dependency/ark-relations"}
ark-r1cs-std = { version = "0.4.0", default-features = false } # this is patched at the workspace level
ark-snark = { version = "^0.4.0"}
ark-serialize = "^0.4.0"
ark-circom = { git = "https://github.com/arnaucube/circom-compat" }
thiserror = "1.0"
rayon = "1.7.0"
num-bigint = "0.4"
num-integer = "0.1"
color-eyre = "=0.6.2"
ark-bn254 = {version="0.4.0", features=["r1cs"]}
ark-groth16 = { version = "^0.4.0" }
sha3 = "0.10"
ark-noname = { git = "https://github.com/dmpierre/ark-noname", branch="feat/sonobe-integration" }
noname = { git = "https://github.com/dmpierre/noname" }
serde_json = "1.0.85"                                                                # to (de)serialize JSON
serde = "1.0.203"
rand = "0.8.5"

# tmp import for espresso's sumcheck
espresso_subroutines = {git="https://github.com/EspressoSystems/hyperplonk", package="subroutines"}

folding-schemes = { path="../sonobe_mod/folding-schemes", package="folding-schemes", features =["light-test"] }

# FULL test needs 250GB
# folding-schemes = { path="../sonobe_mod/folding-schemes", package="folding-schemes"}

solidity-verifiers= {path="../sonobe_mod/solidity-verifiers", package="solidity-verifiers"}
daemonize = "0.5.0"
dialoguer = "0.12.0"
cli-table = "0.4.7"

[features]
default = ["parallel"]
parallel = [
    "ark-std/parallel",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "ark-poly/parallel",
    "ark-crypto-primitives/parallel",
    "ark-r1cs-std/parallel",
    "ark-groth16/parallel",
    "ark-poly-commit/parallel",
    "folding-schemes/parallel",
]


[dev-dependencies]
ark-pallas = {version="0.4.0", features=["r1cs"]}
ark-vesta = {version="0.4.0", features=["r1cs"]}
ark-bn254 = {version="0.4.0", features=["r1cs"]}
ark-grumpkin = {version="0.4.0", features=["r1cs"]}
rand = "0.8.5"
tracing = { version = "0.1", default-features = false, features = [ "attributes" ] }
tracing-subscriber = { version = "0.2" }



